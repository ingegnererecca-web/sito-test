<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sito di test</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1d2433; --muted:#5b6475; --accent:#1f6f5c; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,"Times New Roman",serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  header { padding:64px 24px 40px; text-align:center; border-bottom:1px solid #ddd8cc; }
  h1 { margin:0 0 8px; font-size:2.4rem; letter-spacing:.5px; }
  header p { margin:0; color:var(--muted); font-style:italic; }
  main { max-width:820px; margin:0 auto; padding:40px 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid #e3ded2; border-radius:10px; padding:20px; }
  .card h2 { margin:0 0 6px; font-size:1.1rem; color:var(--accent); }
  .card p { margin:0; color:var(--muted); font-size:.95rem; }
  .demo { margin-top:32px; text-align:center; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 20px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #ora { display:block; margin-top:12px; font-family:monospace; font-size:1.1rem; }
  footer { text-align:center; padding:24px; color:var(--muted); font-size:.85rem; border-top:1px solid #ddd8cc; }
</style>
</head>
<body>
<header>
  <h1>Sito di test</h1>
  <p>Pagina di prova pubblicata con GitHub Pages</p>
</header>
<main>
  <div class="grid">
    <div class="card"><h2>Pubblico</h2><p>Raggiungibile da chiunque con il link, senza accesso.</p></div>
    <div class="card"><h2>Gratuito</h2><p>Ospitato da GitHub Pages, senza costi di hosting.</p></div>
    <div class="card"><h2>Aggiornabile</h2><p>Ogni modifica alla repository aggiorna il sito in pochi minuti.</p></div>
  </div>
  <div class="demo">
    <button id="btn">Verifica JavaScript</button>
    <span id="ora"></span>
  </div>
</main>
<footer>Ing. Maurizio Recca &middot; sito-test</footer>
<script>
  document.getElementById('btn').addEventListener('click', function () {
    document.getElementById('ora').textContent =
      'JavaScript funziona — ' + new Date().toLocaleString('it-IT');
  });
</script>
</body>
</html>
